<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'"
    />
    <title>Tymo</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f6f4;
        --fg: #57575a;
        --dot: #3b6fe0;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0e0f11;
          --fg: #8b8d93;
          --dot: #6798ff;
        }
      }
      html,
      body {
        height: 100%;
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font:
          13px/1.4 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          system-ui,
          sans-serif;
      }
      body {
        display: grid;
        place-items: center;
      }
      p {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 0;
      }
      i {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--dot);
        animation: pulse 1s ease-in-out infinite alternate;
      }
      @keyframes pulse {
        to {
          opacity: 0.25;
        }
      }
    </style>
  </head>
  <body>
    <p><i></i> Opening your library…</p>
  </body>
</html>
