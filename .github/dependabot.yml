version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    # Wait a week before proposing a new release: most hijacked versions are pulled within days.
    # Security updates are not delayed.
    cooldown: { default-days: 7 }
    groups:
      minor-and-patch: { update-types: [minor, patch] }
  # The desktop app has its own lockfile (Electron, electron-builder); Electron releases
  # carry Chromium security fixes, so keep these weekly too.
  - package-ecosystem: npm
    directory: /desktop
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    groups:
      minor-and-patch: { update-types: [minor, patch] }
  # Actions are pinned to commit SHAs; Dependabot updates the SHA and the version comment.
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    cooldown: { default-days: 7 }
    groups:
      # init and analyze must stay on the same version or the CodeQL job fails.
      codeql: { patterns: ["github/codeql-action*"] }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: monthly }
    cooldown: { default-days: 7 }
    ignore:
      # Stay on Node LTS lines (odd majors are short-lived); move to a new LTS by hand.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
