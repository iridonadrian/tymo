name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: node --test desktop/update-logic.test.cjs
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  e2e:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run test:e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-traces
          path: apps/web/test-results

  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t tymo:ci .
      - name: Smoke test container
        run: |
          docker run -d --name tymo -p 127.0.0.1:3210:3210 -e TYMO_PASSWORD=ci-smoke-test-passphrase tymo:ci
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:3210/api/health && break; sleep 1; done
          curl -sf http://127.0.0.1:3210/api/health
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3210/)" = "307"
          docker run --rm tymo:ci node entrypoint.mjs && exit 1 || echo "refused unauthenticated bind as expected"
          docker run --rm -e TYMO_PASSWORD=short tymo:ci node entrypoint.mjs && exit 1 || echo "refused weak password as expected"
