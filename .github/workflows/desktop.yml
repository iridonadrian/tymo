name: Desktop apps

# Builds Tymo.dmg (macOS), Tymo Setup.exe (Windows) and an AppImage (Linux) on GitHub's
# machines. Push a tag like v0.2.0, or run it from the Actions tab: with a tag, the files
# are attached to a GitHub Release; without one, they are kept as workflow artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (e.g. v0.2.0). Leave empty to only build."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, name: mac-apple-silicon }
          - { os: macos-15-intel, name: mac-intel }
          - { os: windows-latest, name: windows }
          - { os: ubuntu-latest, name: linux }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    permissions:
      contents: read
      # Signed build provenance (verify with `gh attestation verify <file> -R <owner>/<repo>`).
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      # Unsigned builds: macOS gets an ad-hoc signature, Windows none.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          # No dependency cache: release builds start clean so a poisoned cache can't
          # end up inside the installers.
          package-manager-cache: false
      # Install scripts off; the only one the desktop build needs (Electron's) runs explicitly.
      - run: npm ci --ignore-scripts
      - run: npm run build -w @tymo/web
      - run: npm ci --ignore-scripts && npm rebuild electron
        working-directory: desktop
      - name: Version from tag
        shell: bash
        working-directory: desktop
        env:
          # Via env, never pasted into the script: a tag can't inject shell commands.
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            npm version "${TAG#v}" --no-git-tag-version --allow-same-version
            # Where the app looks for updates: this repository, set at build time.
            npm pkg set "tymo.releases=$REPO"
          fi
      - run: npm run dist
        working-directory: desktop
      - name: Attest build provenance
        if: github.ref_type == 'tag' || github.event.inputs.tag != ''
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            desktop/dist/*.dmg
            desktop/dist/*.exe
            desktop/dist/*.AppImage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tymo-${{ matrix.name }}
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.exe
            desktop/dist/*.AppImage
          if-no-files-found: error

  # The browser extension as ready-to-load zips (Chrome/Edge/Brave/Dia/Arc and Firefox).
  extension:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Version from tag
        shell: bash
        working-directory: apps/extension
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            npm pkg set "version=${TAG#v}"
          fi
      - run: npm run package -w @tymo/extension
      - name: Name the zips
        shell: bash
        working-directory: apps/extension
        run: |
          mkdir -p out
          for f in tymo-chrome-*.zip; do mv "$f" "out/Tymo-extension-chrome-${f#tymo-chrome-}"; done
          for f in tymo-firefox-*.zip; do mv "$f" "out/Tymo-extension-firefox-${f#tymo-firefox-}"; done
      - name: Attest build provenance
        if: github.ref_type == 'tag' || github.event.inputs.tag != ''
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: apps/extension/out/*.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tymo-extension
          path: apps/extension/out/*.zip
          if-no-files-found: error

  release:
    needs: [build, extension]
    if: github.ref_type == 'tag' || github.event.inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Tymo ${{ github.event.inputs.tag || github.ref_name }}
          files: out/*
          body: |
            **Download for your computer:**

            - **Mac with Apple chip (M1–M4):** `Tymo-…-mac-arm64.dmg`
            - **Mac with Intel chip:** `Tymo-…-mac-x64.dmg`
            - **Windows:** `Tymo-…-win-x64.exe`
            - **Linux:** `Tymo-…-linux-x86_64.AppImage`
            - **Browser extension:** `Tymo-extension-chrome-….zip` (Chrome, Edge, Brave, Dia,
              Arc) or `Tymo-extension-firefox-….zip`. Unzip it, open `chrome://extensions`, turn on
              **Developer mode**, click **Load unpacked** and pick the unzipped folder.

            Check a download came from this repository's build:
            `gh attestation verify <file> -R ${{ github.repository }}`

            These builds aren't signed yet, so the first time you open Tymo:

            - **Mac:** open the .dmg and drag Tymo to Applications. Open it; when macOS says it
              can't check the app, go to **System Settings → Privacy & Security**, scroll down
              and click **Open Anyway**. You only do this once.
            - **Windows:** if "Windows protected your PC" appears, click **More info → Run anyway**.

            Your library is stored on your computer and backed up daily (to iCloud Drive on a
            Mac when it's on). See the README for details.
