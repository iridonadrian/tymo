<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>Tymo</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="popup">
    <header>
      <img class="logo" src="icons/32.png" alt="" />
      <span class="name">Tymo</span>
      <button class="pill hidden" id="inbox-pill" title="Open your Inbox in Tymo">
        <i data-icon="inbox" data-size="12"></i> Inbox <b id="inbox-count">0</b>
      </button>
      <button class="icon-btn" id="open-app" title="Open Tymo" aria-label="Open Tymo">
        <i data-icon="app-window"></i>
      </button>
      <button class="icon-btn" id="open-options" title="Settings" aria-label="Settings">
        <i data-icon="settings"></i>
      </button>
    </header>

    <div id="not-configured" class="panel hidden">
      <div class="center">
        <div class="big">Connect Tymo</div>
        <p class="muted">
          Point the extension at your Tymo app and paste an API token from Settings → Browser
          extension.
        </p>
        <button class="btn primary" id="configure">Open settings</button>
      </div>
    </div>

    <main id="app" class="hidden">
      <nav class="tabs" role="tablist" aria-label="Mode">
        <button role="tab" id="tab-save" aria-selected="true" aria-controls="panel-save">
          <i data-icon="plus" data-size="13"></i> Save
        </button>
        <button role="tab" id="tab-tabs" aria-selected="false" aria-controls="panel-tabs">
          <i data-icon="layers" data-size="13"></i> Tabs
        </button>
        <button role="tab" id="tab-find" aria-selected="false" aria-controls="panel-find">
          <i data-icon="search" data-size="13"></i> Find
        </button>
      </nav>

      <!-- Save this page -->
      <form id="panel-save" class="panel" role="tabpanel" aria-labelledby="tab-save">
        <div id="known" class="known hidden" role="status">
          <i data-icon="circle-check"></i>
          <span class="grow" id="known-text">Already in Tymo</span>
          <a href="#" id="known-open">Open ↗</a>
        </div>
        <div class="preview">
          <img id="fav" alt="" />
          <div class="meta">
            <input id="title" class="title-input" aria-label="Title" />
            <div class="url" id="url"></div>
          </div>
        </div>
        <div class="row">
          <select id="collection" aria-label="Collection">
            <option value="">Inbox</option>
          </select>
          <input id="tags" placeholder="Tags, comma separated" aria-label="Tags" list="tag-list" />
          <datalist id="tag-list"></datalist>
        </div>
        <textarea id="note" placeholder="Note (optional)" aria-label="Note" rows="2"></textarea>
        <div class="chips" role="group" aria-label="Options">
          <button type="button" class="chip fav" id="as-favorite" aria-pressed="false">
            <i data-icon="star" data-size="12"></i> Favorite
          </button>
          <button
            type="button"
            class="chip"
            id="as-bookmark"
            aria-pressed="false"
            title="Put it on your Bookmarks page (sites you come back to)"
          >
            <i data-icon="bookmark" data-size="12"></i> Bookmark
          </button>
          <button
            type="button"
            class="chip"
            id="archive-copy"
            aria-pressed="false"
            title="Keep an offline copy in case the page changes or disappears"
          >
            <i data-icon="archive" data-size="12"></i> Offline copy
          </button>
        </div>
        <div id="save-status" class="status hidden" role="status"></div>
        <div class="actions">
          <button
            type="button"
            class="btn ghost"
            id="screenshot"
            title="Save a screenshot of what you see"
          >
            <i data-icon="camera"></i> Screenshot
          </button>
          <span class="spacer"></span>
          <button type="button" class="btn" id="save-close" title="Save, then close this tab">
            Save &amp; close tab
          </button>
          <button type="submit" class="btn primary" id="save" title="Save (⌘/Ctrl + Enter)">
            Save
          </button>
        </div>
      </form>

      <!-- Open tabs: save them all, tidy up, restore a session -->
      <form id="panel-tabs" class="panel hidden" role="tabpanel" aria-labelledby="tab-tabs">
        <div class="card">
          <div class="stat">
            <span class="big" id="tab-count">–</span>
            <span class="muted" id="tab-count-label">tabs in this window</span>
          </div>
          <div class="dupes hidden" id="dupes">
            <i data-icon="files"></i>
            <span class="grow" id="dupes-text"></span>
            <button type="button" class="btn" id="close-dupes">Close duplicates</button>
          </div>
          <label class="check"
            ><input type="checkbox" id="all-windows" /> Include all windows</label
          >
        </div>
        <input id="session-name" aria-label="Session name" />
        <input
          id="session-tags"
          placeholder="Tags for every tab (optional)"
          aria-label="Session tags"
        />
        <div id="session-status" class="status hidden" role="status"></div>
        <div class="row" id="session-buttons">
          <button
            type="button"
            class="btn"
            id="save-bookmarks"
            title="Put every tab on your Bookmarks page (tab groups become folders)"
          >
            <i data-icon="bookmark"></i> As bookmarks
          </button>
          <button type="submit" class="btn primary" id="save-session">
            <i data-icon="save"></i> Save session
          </button>
        </div>
        <div id="after-session" class="hidden" style="display: grid; gap: 8px">
          <label class="check"
            ><input type="checkbox" id="keep-pinned" checked /> Keep pinned tabs open</label
          >
          <div class="row">
            <button type="button" class="btn" id="view-session">
              <i data-icon="external-link"></i> Open in Tymo
            </button>
            <button type="button" class="btn primary" id="close-tabs">
              <i data-icon="x"></i> Close saved tabs
            </button>
          </div>
        </div>

        <div class="section-title">
          <span class="eyebrow">Saved sessions</span>
          <span class="hint">Restore reopens every tab</span>
        </div>
        <div class="list" id="sessions"></div>
      </form>

      <!-- Search the library; bookmarks launcher when empty -->
      <section id="panel-find" class="panel hidden" role="tabpanel" aria-labelledby="tab-find">
        <div class="search">
          <i data-icon="search"></i>
          <input
            id="find-q"
            type="search"
            placeholder="Search your library… tag:x domain:y is:fav"
            aria-label="Search your library"
            autocomplete="off"
          />
        </div>
        <div class="eyebrow" id="find-heading">Your bookmarks</div>
        <div class="list" id="find-results" role="listbox" aria-label="Results"></div>
      </section>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
